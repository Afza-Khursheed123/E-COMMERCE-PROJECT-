
services:
  backend:
    build:
      context: ./node-app
    container_name: ecommerce-backend
    restart: unless-stopped
    env_file:
      - ./node-app/.env
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uploads:/uploads
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./thriftifyy
    container_name: ecommerce-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
