
name: E-Commerce CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./node-app
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/afza-khursheed123/e-commerce-backend:latest
            ghcr.io/afza-khursheed123/e-commerce-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./thriftifyy
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/afza-khursheed123/e-commerce-frontend:latest
            ghcr.io/afza-khursheed123/e-commerce-frontend:${{ github.sha }}

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS authentication
        if: github.event_name == 'push'
        run: aws sts get-caller-identity
      
      
      
      - name: Deploy backend to private EC2
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          SCRIPT_B64=$(base64 -w 0 node-app/deploy-backend.sh)

          REMOTE_COMMAND="printf '%s' '$SCRIPT_B64' | base64 -d > /tmp/cea-deploy-backend.sh && bash /tmp/cea-deploy-backend.sh '$GITHUB_SHA'"

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_COMMAND" '{commands:[$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-094b779cdf837810c \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "Backend deployment started: $COMMAND_ID"

          for i in $(seq 1 60); do
            sleep 10

            STATUS=$(aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-094b779cdf837810c \
              --query Status \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Backend deployed successfully!"
              exit 0
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region ap-south-1 \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-094b779cdf837810c \
                  --query '{Status:Status,Details:StatusDetails,ExitCode:ResponseCode}' \
                  --output json
                exit 1
                ;;
            esac
          done

          echo "Backend deployment timed out."
          exit 1
    
      - name: Deploy frontend to public EC2
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          SCRIPT_B64=$(base64 -w 0 thriftifyy/deploy-frontend.sh)

          REMOTE_COMMAND="printf '%s' '$SCRIPT_B64' | base64 -d > /tmp/cea-deploy-frontend.sh && bash /tmp/cea-deploy-frontend.sh '$GITHUB_SHA'"

          PARAMETERS=$(jq -n --arg cmd "$REMOTE_COMMAND" '{commands:[$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-0fee963f148c91dc7 \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "Frontend deployment started: $COMMAND_ID"

          for i in $(seq 1 60); do
            sleep 10

            STATUS=$(aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0fee963f148c91dc7 \
              --query Status \
              --output text)

            echo "Frontend deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Frontend deployed successfully!"
              exit 0
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region ap-south-1 \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0fee963f148c91dc7 \
                  --query '{Status:Status,Details:StatusDetails,ExitCode:ResponseCode}' \
                  --output json
                exit 1
                ;;
            esac
          done

          echo "Frontend deployment timed out."
          exit 1



      - name: Deploy frontend to ASG instances
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ecommerce-cea-frontend-asg \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No active ASG instances found."
            exit 1
          fi

          SCRIPT_B64=$(base64 -w 0 thriftifyy/deploy-frontend.sh)
          REMOTE_COMMAND="printf '%s' '$SCRIPT_B64' | base64 -d > /tmp/cea-deploy-frontend.sh && bash /tmp/cea-deploy-frontend.sh '$GITHUB_SHA'"
          PARAMETERS=$(jq -n --arg cmd "$REMOTE_COMMAND" '{commands:[$cmd]}')

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Deploying to $INSTANCE_ID"

            COMMAND_ID=$(aws ssm send-command \
              --region ap-south-1 \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$PARAMETERS" \
              --query 'Command.CommandId' \
              --output text)

            SUCCESS=false

            for i in $(seq 1 60); do
              sleep 10

              STATUS=$(aws ssm get-command-invocation \
                --region ap-south-1 \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query Status \
                --output text)

              echo "$INSTANCE_ID: $STATUS"

              if [ "$STATUS" = "Success" ]; then
                SUCCESS=true
                break
              fi

              case "$STATUS" in
                Failed|Cancelled|TimedOut|Cancelling)
                  exit 1
                  ;;
              esac
            done

            if [ "$SUCCESS" != true ]; then
              echo "Deployment failed or timed out on $INSTANCE_ID"
              exit 1
            fi
          done

          echo "All ASG frontend instances updated successfully!"
