
name: E-Commerce CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./node-app
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/afza-khursheed123/e-commerce-backend:latest
            ghcr.io/afza-khursheed123/e-commerce-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./thriftifyy
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/afza-khursheed123/e-commerce-frontend:latest
            ghcr.io/afza-khursheed123/e-commerce-frontend:${{ github.sha }}

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS authentication
        if: github.event_name == 'push'
        run: aws sts get-caller-identity
      
      
      - name: Test SSM connection to private backend EC2
        if: github.event_name == 'push'
        run: |
          aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-094b779cdf837810c \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo CEA-PRIVATE-SSM-SUCCESS"]'
